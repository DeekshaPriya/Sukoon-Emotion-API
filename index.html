<!DOCTYPE html>
<html>
<head>
    <title>Sukoon Emotion Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f2f2f2;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Sukoon Facial Emotion Detection</h1>

    <p>Upload a video to test the API.</p>

    <input type="file" id="video" accept="video/*">

    <br><br>

    <button onclick="predictEmotion()">Analyze Video</button>

    <div id="result">
        Result will appear here...
    </div>

    <script>

        const API_URL = "http://127.0.0.1:8000";

        async function predictEmotion() {

            const fileInput = document.getElementById("video");
            const result = document.getElementById("result");

            if (!fileInput.files.length) {
                result.innerText = "Please select a video.";
                return;
            }

            const formData = new FormData();

            formData.append("video", fileInput.files[0]);

            result.innerText = "Sending video...";

            try {

                const response = await fetch(
                    API_URL + "/predict-emotion",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                result.innerText =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                result.innerText =
                    "Error: " + error.message;

            }
        }

    </script>

</body>
</html>
